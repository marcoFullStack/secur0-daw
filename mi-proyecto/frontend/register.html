<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Foro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <article class="grid">
            <div>
                <hgroup>
                    <h1>Crear Cuenta</h1>
                    <p>Únete para publicar en el muro.</p>
                </hgroup>
                <form id="register-form">
                    <input type="text" name="username" placeholder="Nombre de usuario" aria-label="Nombre de usuario" required>
                    <input type="password" name="password" placeholder="Contraseña" aria-label="Contraseña" required minlength="6">
                    <input type="password" name="confirm_password" placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" required minlength="6">
                    <button type="submit" class="contrast">Registrarse</button>
                    <div id="register-message" class="alert-message"></div>
                </form>
                <p><small>¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></small></p>
                <p><small><a href="/">Volver al muro</a></small></p>
            </div>
        </article>
    </main>
    <script src="app.js"></script>
</body>
</html>
